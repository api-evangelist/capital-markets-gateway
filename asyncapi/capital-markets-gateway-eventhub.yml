name: CMG XC EventHub
summary: >-
  Capital Markets Gateway advertises a real-time event notification surface for the CMG XC workflow
  platform, called EventHub. It is documented only as prose in the public product FAQ — no AsyncAPI
  document, event catalog, channel list, payload schema, subscription reference or endpoint is
  published anywhere on a public host.
delivery: >-
