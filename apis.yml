aid: capital-markets-gateway
name: Capital Markets Gateway
description: >-
  Capital Markets Gateway (CMG) is a New York headquartered financial technology company that connects
  the buy side and the sell side across the equity capital markets (ECM) offering process. Its two
  products are CMG XC, a workflow-management platform carrying the full ECM deal lifecycle — offering
  setup, termsheet publication, a consolidated and de-duplicated order book, bookbuilding, allocations,
  designations and trade release — and CMG DataLab, an ECM data and analytics service spanning 20+ years
  and 60,000+ equity transactions across 50+ regions, with 550+ deal, structure and performance metrics
  per deal. CMG names three programmatic surfaces in its own public FAQs — a DataLab Real-Time Feed
  (GraphQL API), a CMG XC REST API covering setup through allocation and post-trade, and EventHub
  real-time event notifications for straight-through processing into OMS and trade-processing systems —
  but publishes no public API reference, endpoint or machine-readable contract for any of them. The
  documentation host redirects to a customer identity login.
