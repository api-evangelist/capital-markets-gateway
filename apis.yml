apis:
- aid: capital-markets-gateway-datalab-real-time-feed
  name: CMG DataLab Real-Time Feed (GraphQL API)
  description: >-
    Schema-driven GraphQL access to CMG's live and historical ECM dataset. Per CMG's published FAQ the
    feed lets teams "query specific fields across deals, participants, terms and activity through a
    single flexible endpoint" and stream live ECM data into internal data warehouses, dashboards,
    pricing models, risk systems and analytics tools. No public endpoint, SDL or reference is
    published; access is arranged through CMG and documentation sits behind a customer login.
  humanURL: https://cmgx.io/data-insights/
  tags:
  - GraphQL
  - Market Data
  - Equity Capital Markets
  - Real-Time Data
  properties:
  - type: x-access
    url: https://cmgx.io/book-a-demo/
- aid: capital-markets-gateway-xc-rest-api
  name: CMG XC REST API
  description: >-
    REST API for the CMG XC workflow platform. Per CMG's published FAQ it provides "systemic support of
    the full ECM deal lifecycle from setup through allocation and post-trade" and "integrates with CRM,
    OMS and trade processing systems for straight-through processing with buy-side participants."
    Allocations can be released and consumed electronically via the REST API. No public endpoint,
    OpenAPI or reference is published.
  humanURL: https://cmgx.io/workflow-management/
  tags:
  - REST
  - Equity Capital Markets
  - Order Management
  - Straight-Through Processing
  properties:
  - type: x-access
    url: https://cmgx.io/book-a-demo/
- aid: capital-markets-gateway-eventhub
  name: CMG XC EventHub
  description: >-
    Real-time event notification surface for CMG XC. Per CMG's published FAQ, "real-time event
    notifications are delivered via EventHub, enabling STP integration with internal trade processing
    and OMS platforms," connecting platform events such as trade release, allocation updates and
    attestation status changes into internal workflows. No AsyncAPI, event catalog or subscription
    reference is published.
  humanURL: https://cmgx.io/workflow-management/
  tags:
  - Event
  - Streaming
  - Equity Capital Markets
  tags_raw:
  - Events
  - Streaming
  - Equity Capital Markets
